[package]
name = "service"                # The name of your Rust package (crate)
version = "0.1.0"               # The version of your package
edition = "2021"                # The Rust edition (language features and idioms)

[dependencies]
actix-web = "4.4"               # Web framework for building HTTP servers
actix-cors = "0.6"              # CORS (Cross-Origin Resource Sharing) support for Actix Web
sentry = "0.32"                 # Error tracking and reporting to Sentry
sentry-actix = "0.32"           # Sentry integration for Actix Web
sentry-tracing = "0.32"         # Sentry integration with tracing spans
tokio = { version = "1.0", features = ["full"] } # Asynchronous runtime for Rust, with all features enabled
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal"] }
# Async SQL toolkit, with support for Postgres, UUIDs, chrono dates, JSON, and bigdecimal types
reqwest = { version = "0.11", features = ["json"] } # HTTP client with JSON support
redis = { version = "0.23", features = ["tokio-comp"] } # Redis client with Tokio async support
serde = { version = "1.0", features = ["derive"] } # Serialization/deserialization framework, with derive macros
serde_json = "1.0"              # JSON serialization/deserialization using Serde
config = "0.13"                 # Layered configuration management
dotenv = "0.15"                 # Loads environment variables from a `.env` file
uuid = { version = "1.0", features = ["serde", "v4"] } # UUID generation and parsing, with Serde and v4 support
chrono = { version = "0.4", features = ["serde"] } # Date and time library, with Serde support
thiserror = "1.0"               # Convenient error type derivation
anyhow = "1.0"                  # Flexible error handling
async-trait = "0.1"             # Allows async functions in traits
validator = { version = "0.16", features = ["derive"] } # Data validation, with derive macros
log = "0.4"                     # Logging facade or interface providing macros but it doesn't no where to send logs.
env_logger = "0.10"             # it actually reads logs and send them to output .Logger implementation that reads from environment variables,to print error in Output
lazy_static = "1.4.0"           # Allows static variables that require code to initialize
once_cell = "1.12.0"            # Single-assignment cells for lazy/static initialization
futures = "0.3"                 # Utilities for asynchronous programming
bigdecimal = { version = "0.3", features = ["serde"] } # Arbitrary-precision decimal numbers, with Serde support
num-traits = "0.2"              # Numeric trait helpers
hmac = "0.12"                   # HMAC (Hash-based Message Authentication Code) implementation
sha1 = "0.10"                   # SHA-1 hash function
base64 = "0.21"                 # Base64 encoding/decoding
aes = "0.8"                     # AES encryption algorithm
ctr = "0.9"                     # Counter (CTR) mode for block ciphers
sha2 = "0.10"                   # SHA-2 hash functions (SHA-256, etc.)
bcrypt = "0.10"                 # Bcrypt password hashing
csv = "1.1"                     # CSV reading and writing
opentelemetry = "0.28.0"        # OpenTelemetry API for distributed tracing
opentelemetry-appender-tracing = "0.28.1" # OpenTelemetry integration with tracing
opentelemetry-otlp = { version = "0.28.0", features = ["grpc-tonic"] } # OTLP exporter for OpenTelemetry, using gRPC
opentelemetry_sdk = "0.28.0"    # OpenTelemetry SDK implementation
tracing = {version="0.1.41" , features = ["std"]} # Structured, event-based logging
tracing-subscriber = { version =  "0.3.19", features = ["env-filter", "registry", "std", "fmt"] }
# Subscribers for tracing, with environment filtering, registry, and formatting
thread_local = "1.1.8"          # Thread-local storage utilities
semver = "1.0"                  # Semantic version parsing and comparison

[dev-dependencies]
tokio-test = "0.4"              # Testing utilities for Tokio-based async code